name: Newsletter semanal

on:
  schedule:
    - cron: "41 13 * * 1"   # lunes 10:41 hora argentina, después de actualizar los datos
  workflow_dispatch:
    inputs:
      send:
        description: "Enviar directamente, sin dejar borrador para revisar"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Armar la edición y subirla a Buttondown
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          NEWSLETTER_STATUS: ${{ inputs.send && 'send' || 'draft' }}
          TZ: America/Argentina/Buenos_Aires
        run: |
          python scripts/build_newsletter.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guardar la edición en el repositorio
        run: |
          if [ -z "$(git status --porcelain -- newsletter/)" ]; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newsletter/
          git commit -m "Newsletter $(ls newsletter | sort | tail -1)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
