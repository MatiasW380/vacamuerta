name: Actualizar fuentes diarias

on:
  schedule:
    - cron: "7 12 * * *"   # todos los días 09:07 hora argentina
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_extras.py"
      - ".github/workflows/update-extras.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Fractura, dólar, petróleo, Boletín Oficial y noticias
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python scripts/build_extras.py
          echo "### Estado de las fuentes" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.status | to_entries[] | "- \(.key): \(if .value.ok then "ok" else .value.error end)"' data/extras.json >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar cambios
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Actualiza fuentes diarias ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
