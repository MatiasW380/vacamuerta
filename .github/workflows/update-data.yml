name: Actualizar datos de Vaca Muerta

on:
  schedule:
    - cron: "17 11 * * 1"   # lunes 08:17 hora argentina
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_data.py"
      - "scripts/build_map.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Descargar y procesar Capítulo IV
        run: |
          python scripts/build_data.py
          python scripts/build_map.py
          echo "### Datos generados" >> "$GITHUB_STEP_SUMMARY"
          jq -c "{latest_period, kpis, meses: (.monthly|length)}" data/vm.json >> "$GITHUB_STEP_SUMMARY"
          jq -c "{ok, error, areas_layer, ducts_layer, areas_matched, oil_share_on_map_pct}" data/map_status.json >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar cambios
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Actualiza datos de Vaca Muerta ($(jq -r .latest_period data/vm.json))"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
